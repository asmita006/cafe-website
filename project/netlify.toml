[[headers]]
  for = "/*.js"
    [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/*.mjs"
    [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/*.ts"
    [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/*.jsx"
    [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/*.tsx"
    [headers.values]
    Content-Type = "application/javascript"

# Handle single page application routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200